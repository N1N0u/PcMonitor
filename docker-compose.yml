# ============================================================
# FULL MONITORING STACK
# Prometheus + Grafana + Alertmanager + Exporters
# ============================================================
# FIRST-TIME SETUP: Run ./setup.sh before `docker compose up`
# It installs the NVIDIA Container Toolkit (required once per host).
# ============================================================

services:

  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    # prom/prometheus runs as user "nobody" (65534:65534).
    # Setting this here avoids having to chown the data dir manually.
    user: "65534:65534"

    ports:
      - "9090:9090"

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./data/prometheus:/prometheus

    depends_on:
      - node-exporter
      - alertmanager
      - dcgm-exporter
      - intel-gpu-exporter
      - myapp

    networks:
      - monitoring

  # ============================================================
  # ALERTMANAGER
  # ============================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped

    ports:
      - "9093:9093"

    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/alertmanager:/alertmanager

    networks:
      - monitoring

  # ============================================================
  # NODE EXPORTER
  # ============================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    pid: host

    ports:
      - "9100:9100"

    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    networks:
      - monitoring

  # ============================================================
  # NVIDIA GPU EXPORTER
  # ============================================================
  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: dcgm-exporter
    restart: unless-stopped

    ports:
      - "9400:9400"

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    cap_add:
      - SYS_ADMIN

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - monitoring

  # ============================================================
  # INTEL GPU EXPORTER
  # ============================================================
  intel-gpu-exporter:
    image: ghcr.io/onedr0p/intel-gpu-exporter:rolling
    container_name: intel-gpu-exporter
    restart: unless-stopped

    privileged: true
    pid: host

    ports:
      - "8686:8080"

    volumes:
      - /dev/dri:/dev/dri

    networks:
      - monitoring

  # ============================================================
  # GRAFANA IMAGE RENDERER
  # ============================================================
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      ENABLE_METRICS: "true"
      AUTH_TOKEN: renderer_token

    networks:
      - monitoring

  # ============================================================
  # GRAFANA
  # ============================================================
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    restart: unless-stopped

    # Grafana runs as UID 472. Setting this here means the ./data/grafana
    # volume is owned correctly without a manual chown after cloning.
    user: "472:472"

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"

      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: renderer_token

    volumes:
      - ./data/grafana:/var/lib/grafana

    depends_on:
      - prometheus
      - renderer

    networks:
      - monitoring

  # ============================================================
  # STRESS TEST APP
  # ============================================================
  myapp:
    build: ./app
    container_name: myapp
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - monitoring

# ============================================================
# NETWORK
# ============================================================
networks:
  monitoring:
    driver: bridge
