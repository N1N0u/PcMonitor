# ============================================================
# Alertmanager Configuration — alertmanager.yml
# Prometheus Crash Course Demo
# ============================================================
# Replace SLACK_WEBHOOK_URL with your real webhook URL from:
# https://api.slack.com/apps -> Incoming Webhooks
# ============================================================

global:
  # How long to wait before resending an alert
  resolve_timeout: 5m

  # Default Slack configuration (override per-receiver)
  slack_api_url: 'https://hooks.slack.com/slack'  # placeholder — replace with real webhook

# ============================================================
# TEMPLATES — customize notification messages
# ============================================================
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ============================================================
# ROUTE — alert routing tree
# ============================================================
route:
  # Group alerts by these labels to reduce noise
  group_by: ['alertname', 'severity', 'job']

  # Wait 30s before sending first alert in a group (collect related alerts)
  group_wait: 30s

  # Wait 5m before sending alerts for a new group interval
  group_interval: 5m

  # Resend resolved alerts after 4 hours
  repeat_interval: 4h

  # Default receiver if no sub-route matches
  receiver: 'slack-default'

  # Sub-routes — more specific rules evaluated top-to-bottom
  routes:
    # Critical alerts → immediate notification to critical channel
    - match:
        severity: critical
      receiver: 'slack-critical'
      group_wait: 10s      # Faster notification for critical
      repeat_interval: 1h  # Remind every hour until resolved

    # Warning alerts → standard monitoring channel
    - match:
        severity: warning
      receiver: 'slack-warning'
      group_wait: 1m
      repeat_interval: 6h

    # Ops team alerts
    - match:
        team: ops
      receiver: 'slack-ops'

    # Backend team alerts
    - match:
        team: backend
      receiver: 'slack-backend'

# ============================================================
# RECEIVERS — where to send notifications
# ============================================================
receivers:

  # Default receiver
  - name: 'slack-default'
    slack_configs:
      - api_url: 'https://hooks.slack.com/slack'  # placeholder — replace with real webhook
        channel: '#on-call-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Critical alerts — bright red, immediate
  - name: 'slack-critical'
    slack_configs:
      - api_url: 'https://hooks.slack.com/slack'  # placeholder — replace with real webhook
        channel: '#on-call-alerts'
        send_resolved: true
        icon_emoji: ':fire:'
        username: 'Prometheus CRITICAL'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}{{ end }}
          {{ end }}
        color: 'danger'

  # Warning alerts — yellow
  - name: 'slack-warning'
    slack_configs:
      - api_url: 'https://hooks.slack.com/slack'  # placeholder — replace with real webhook
        channel: '#on-call-alerts'
        send_resolved: true
        icon_emoji: ':warning:'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        color: 'warning'

  # Ops-specific channel
  - name: 'slack-ops'
    slack_configs:
      - api_url: 'https://hooks.slack.com/slack'  # placeholder — replace with real webhook
        channel: '#on-call-alerts'
        send_resolved: true
        title: '[OPS] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          {{ end }}

  # Backend team channel
  - name: 'slack-backend'
    slack_configs:
      - api_url: 'https://hooks.slack.com/slack'  # placeholder — replace with real webhook
        channel: '#on-call-alerts'
        send_resolved: true
        title: '[BACKEND] {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Email receiver example (uncomment and configure to use)
  # - name: 'email-alerts'
  #   email_configs:
  #     - to: 'oncall@yourcompany.com'
  #       from: 'prometheus@yourcompany.com'
  #       smarthost: 'smtp.gmail.com:587'
  #       auth_username: 'prometheus@yourcompany.com'
  #       auth_password: 'your-app-password'
  #       send_resolved: true

  # PagerDuty receiver example (uncomment and configure to use)
  # - name: 'pagerduty-critical'
  #   pagerduty_configs:
  #     - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
  #       description: '{{ template "pagerduty.default.description" . }}'
  #       send_resolved: true

# ============================================================
# INHIBIT RULES — suppress lower-priority alerts
# when higher-priority alerts are already firing
# ============================================================
inhibit_rules:
  # If a critical alert is firing, suppress warnings of the same type
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']

  # If InstanceDown is firing, suppress all other alerts for that instance
  - source_match:
      alertname: 'InstanceDown'
    target_match_re:
      alertname: '.+'
    equal: ['instance']
