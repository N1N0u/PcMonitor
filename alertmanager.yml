# ============================================================
# Alertmanager Configuration — Email Only 
# ============================================================

global:
  resolve_timeout: 5m

 
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'youremail@gmail.com'
  smtp_auth_username: 'youremail@gmail.com'
  smtp_auth_password: 'xxxx xxxx xxxx xxxx'  
  smtp_require_tls: true

# ============================================================
# ROUTE —
# ============================================================
route:
  group_by: ['alertname', 'severity', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-default'

  routes:
    # Critical 
    - match:
        severity: critical
      receiver: 'email-critical'
      group_wait: 10s
      repeat_interval: 1h

    # Warning
    - match:
        severity: warning
      receiver: 'email-warning'
      group_wait: 1m
      repeat_interval: 6h

# ============================================================
# RECEIVERS 
# ============================================================
receivers:


  - name: 'email-default'
    email_configs:
      - to: 'youremail@gmail.com'
        send_resolved: true
        headers:
          Subject: '[ALERT] {{ .GroupLabels.alertname }}'
        html: |
          <h3>🔔 Alert: {{ .GroupLabels.alertname }}</h3>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <hr>
          {{ range .Alerts }}
          <p>
            <strong>Instance:</strong> {{ .Labels.instance }}<br>
            <strong>Summary:</strong> {{ .Annotations.summary }}<br>
            <strong>Description:</strong> {{ .Annotations.description }}<br>
            <strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          </p>
          <hr>
          {{ end }}

  # Critical
  - name: 'email-critical'
    email_configs:
      - to: 'youremail@gmail.com'
        send_resolved: true
        headers:
          Subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: #dc3545;">🚨 CRITICAL ALERT</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <hr style="border: 2px solid #dc3545;">
          {{ range .Alerts }}
          <div style="background: #f8d7da; padding: 10px; margin: 10px 0; border-left: 5px solid #dc3545;">
            <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
            <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
            <p><strong>Description:</strong> {{ .Annotations.description }}</p>
            <p><strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
            {{ if .Annotations.runbook }}<p><strong>Runbook:</strong> {{ .Annotations.runbook }}</p>{{ end }}
          </div>
          {{ end }}

  # Warning 
  - name: 'email-warning'
    email_configs:
      - to: 'youremail@gmail.com'
        send_resolved: true
        headers:
          Subject: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        html: |
          <h3 style="color: #ffc107;">⚠️ Warning Alert</h3>
          {{ range .Alerts }}
          <p>
            <strong>Instance:</strong> {{ .Labels.instance }}<br>
            <strong>Summary:</strong> {{ .Annotations.summary }}<br>
            <strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          </p>
          <hr>
          {{ end }}

# ============================================================
# INHIBIT RULES
# ============================================================
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']